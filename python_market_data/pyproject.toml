[tool.poetry]
name = "python-market-data"
version = "0.1.0"
description = "Market data module using FastAPI"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "python_market_data"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
